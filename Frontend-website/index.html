<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f4c29" />

    <!-- Favicon (PNG is supported by all modern browsers; helps when .ico is missing) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/logo/icon.png" />

    <!-- Fonts: self-hosted woff2 (public/fonts/, @font-face in src/styles.css).
         No render-blocking third-party CSS; preload only the two critical faces
         (body + display), the rest load on demand via font-display: swap. -->
    <link rel="preload" href="/fonts/manrope-normal-400-800-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-serif-display-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Titles/descriptions below mirror the runtime <Seo> props (src/pages/index.jsx)
         so the static document and the hydrated app never disagree. -->
    <title>ShushrutamVed Care | Natural Healing for a Healthier Life</title>
    <meta
      name="description"
      content="Holistic and integrative wellness with Dr. Aarti Sen in Bhopal — Ayurveda, naturopathy, nutrition, yoga therapy, Panchakarma, Reiki and oncology nutrition support for weight, thyroid, PCOS, digestion, pain and stress."
    />
    <meta name="author" content="ShushrutamVed Care" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="ShushrutamVed Care" />
    <meta property="og:locale" content="en_IN" />
    <meta
      property="og:title"
      content="ShushrutamVed Care | Natural Healing for a Healthier Life"
    />
    <meta
      property="og:description"
      content="Holistic and integrative wellness with Dr. Aarti Sen in Bhopal — Ayurveda, naturopathy, nutrition, yoga therapy, Panchakarma, Reiki and oncology nutrition support for weight, thyroid, PCOS, digestion, pain and stress."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:image" content="%SITE_ORIGIN%/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShushrutamVed Care | Natural Healing for a Healthier Life" />
    <meta
      name="twitter:description"
      content="Holistic and integrative wellness with Dr. Aarti Sen in Bhopal — Ayurveda, naturopathy, nutrition, yoga therapy, Panchakarma, Reiki and oncology nutrition support for weight, thyroid, PCOS, digestion, pain and stress."
    />
    <meta name="twitter:image" content="%SITE_ORIGIN%/og-image.png" />

    <!-- Search engine verification. Replaced at build time from
         VITE_GOOGLE_SITE_VERIFICATION (see vite.config.js); empty when unset. -->
    %GOOGLE_SITE_VERIFICATION%
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
